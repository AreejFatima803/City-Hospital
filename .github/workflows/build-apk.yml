name: Build APK
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Backend API URL"
        required: true
        default: "http://192.168.199.231:5000/api"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: Build APK
        run: |
          PUB=$(find . -name pubspec.yaml -not -path "./.*" | head -1)
          if [ -z "$PUB" ]; then echo "pubspec.yaml not found. Upload the app folder."; exit 1; fi
          echo "Flutter project found in: $(dirname "$PUB")"
          cd "$(dirname "$PUB")"
          flutter create . --platforms=android --org com.cityhospital
          URL="${{ github.event.inputs.api_url }}"
          sed -i "s|^const String baseUrl = .*|const String baseUrl = '${URL}';|" lib/api.dart
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/><application android:usesCleartextTraffic="true"|' android/app/src/main/AndroidManifest.xml
          flutter pub get
          flutter build apk --release
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/out/"
      - uses: actions/upload-artifact@v4
        with:
          name: city-hospital-apk
          path: out/app-release.apk
