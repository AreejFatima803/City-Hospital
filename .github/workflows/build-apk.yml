name: Build APK
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Backend API URL (e.g. https://my-app.onrender.com/api or http://192.168.1.5:5000/api)"
        required: true
        default: "http://192.168.1.5:5000/api"
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: Generate Android project
        working-directory: app
        run: flutter create . --platforms=android --org com.cityhospital
      - name: Set API URL, internet permission, cleartext
        working-directory: app
        run: |
          URL="${{ github.event.inputs.api_url || 'http://10.0.2.2:5000/api' }}"
          sed -i "s|^const String baseUrl = .*|const String baseUrl = '${URL}';|" lib/api.dart
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/><application android:usesCleartextTraffic="true"|' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
        working-directory: app
      - run: flutter build apk --release
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: city-hospital-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
